<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Dapur MBG</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b132b">
    <style>
        :root {
            --bg-color: #0b132b; --card-bg: #1c2541; --btn-color: #3a506b; 
            --border-red: #ff4d4d; --text-color: #e0e1dd;
            --clay-shadow: 8px 8px 16px #060b19, -8px -8px 16px #101c3d;
            --inset-shadow: inset 4px 4px 8px #060b19, inset -4px -4px 8px #101c3d;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* HEADER PREMIUM - LOGO KANAN ATAS */
        .kop-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; margin-bottom: 30px; border-bottom: 3px double var(--border-red); background: var(--card-bg); border-radius: 16px; box-shadow: var(--clay-shadow); }
        .kop-titles { flex: 1; }
        .kop-title { font-size: 1.4rem; font-weight: 900; color: #48cae4; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin: 0 0 5px 0; }
        .kop-subtitle { font-size: 0.85rem; color: #94d2bd; letter-spacing: 1px; margin: 0; }
        .kop-logo { width: 60px; height: 60px; object-fit: contain; margin-left: 15px; border-radius: 10px; box-shadow: var(--clay-shadow); }

        .card { background: var(--card-bg); border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: var(--clay-shadow); border: 1px solid var(--border-red); }
        .card h2, .card h3 { color: #48cae4; border-left: 4px solid var(--border-red); padding-left: 12px; margin-top: 0; font-size:1.2rem; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .kop-title { font-size: 1.1rem; } .kop-logo { width: 45px; height: 45px;} }
        
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: bold; color: #a5a5a5; }
        input, select { width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--bg-color); color: var(--text-color); box-shadow: var(--inset-shadow); box-sizing: border-box; margin-bottom: 15px; font-size:0.95rem; font-weight:bold; transition:0.3s;}
        input:focus, select:focus { outline: 1px solid #48cae4; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th { background: rgba(58, 80, 107, 0.4); padding: 15px; text-align: left; color: #48cae4; border-bottom: 2px solid var(--border-red); font-size:0.9rem;}
        td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .btn { padding: 14px 20px; border: none; border-radius: 10px; background: var(--btn-color); color: #fff; font-weight: bold; cursor: pointer; box-shadow: inset 2px 2px 4px rgba(255,255,255,0.15), inset -2px -2px 4px rgba(0,0,0,0.4), 4px 4px 10px rgba(0,0,0,0.4); transition: 0.2s; font-size:0.95rem;}
        .btn:active { box-shadow: var(--inset-shadow); transform: scale(0.95); }
        .btn-danger { background: #d90429; } .btn-success { background: #2a9d8f; }
        .btn-full { width: 100%; font-size: 1.1rem; padding: 18px; margin-top: 15px; }
        
        .badge { padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .badge-progress { background: #f4a261; color: #000; }
        .badge-cicil { background: #e9c46a; color: #000; }
        .badge-lunas { background: #2a9d8f; color: #fff; }
        .action-bar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }

        /* KARTU DASHBOARD CLAYMORPHISM SERAGAM */
        .dash-card { border-radius:16px; padding:20px; box-shadow:var(--clay-shadow); border:1px solid var(--border-red); text-align:center;}
        .dash-card h4 { margin:0 0 10px 0; color:#a5a5a5; font-size:0.9rem; text-transform:uppercase; letter-spacing:1px;}
        .dash-card h2 { margin:0; color:#fff; font-size:1.6rem; text-shadow:2px 2px 5px rgba(0,0,0,0.5);}

        /* CUSTOM MODAL ALERT & PROMPT */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11,19,43,0.85); backdrop-filter: blur(5px); z-index: 9998; }
        .modal-box { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); border: 1px solid var(--border-red); box-shadow: var(--clay-shadow); padding: 30px; border-radius: 20px; z-index: 9999; text-align: center; width: 90%; max-width: 400px; }
        .modal-box p { color: var(--text-color); font-size: 1rem; margin-top: 0; margin-bottom: 20px; line-height: 1.5; }
        .modal-input { margin-bottom: 20px; text-align: center; font-size: 1.2rem; color:#06d6a0;}
    </style>
</head>
<body>

<div id="alertOverlay" class="modal-overlay"></div>
<div id="customAlert" class="modal-box">
    <p id="alertMessage"></p>
    <button class="btn btn-success btn-full" style="margin-top:0;" onclick="tutupAlert()">Oke, Paham</button>
</div>

<div id="promptOverlay" class="modal-overlay"></div>
<div id="customPrompt" class="modal-box">
    <h3 style="color:#06d6a0; border:none; padding:0; margin-bottom:10px;">BAYAR CICILAN</h3>
    <p id="promptDesc" style="font-size:0.9rem; color:#a5a5a5;"></p>
    <input type="text" id="promptInput" class="modal-input" placeholder="Rp 0" oninput="formatRupiahInput(this)">
    <div style="display:flex; gap:10px;">
        <button class="btn btn-success" style="flex:1;" onclick="submitBayar()">Bayar</button>
        <button class="btn btn-danger" style="flex:1;" onclick="tutupPrompt()">Batal</button>
    </div>
</div>

<div class="container">
    <div class="kop-header">
        <div class="kop-titles">
            <div class="kop-title">SMM DAPUR MBG</div>
            <div class="kop-subtitle">Sistem Rekonstruksi & Anggaran</div>
        </div>
        <img src="icon.png" class="kop-logo" alt="Logo">
    </div>

    <div class="action-bar">
        <button class="btn" onclick="showSection('input-section')">📝 Form Input</button>
        <button class="btn" onclick="showSection('monitoring-section')">📊 Dashboard & Cetak</button>
        <button class="btn" onclick="showSection('setting-section')">⚙️ Pengaturan</button>
        <button class="btn btn-success" onclick="sinkronisasiDataCloud()" id="btnSync">🔄 Sinkron Cloud</button>
    </div>

    <div id="setting-section" class="card app-section" style="display:none;">
        <h2>Pengaturan Tanda Tangan & Invoice</h2>
        <div class="grid-2">
            <div><label>Lokasi TTD</label><input type="text" id="setLokasi"></div>
            <div><label>Jabatan</label><input type="text" id="setJabatan"></div>
            <div><label>Nama Bank</label><input type="text" id="setBank"></div>
            <div><label>No. Rekening</label><input type="text" id="setNoRek"></div>
            <div><label>Atas Nama Rekening</label><input type="text" id="setAtasNama"></div>
        </div>
        <button class="btn btn-success" onclick="simpanSetting()">💾 Simpan Pengaturan</button>
    </div>

    <div id="input-section" class="card app-section">
        <h2>Input Perbaikan Dapur</h2>
        <form id="formUtama">
            <div class="grid-2">
                <div><label>Nama Dapur</label><input type="text" id="namaDapur" required></div>
                <div><label>Nama PIC / SPPG</label><input type="text" id="pic" required></div>
                <div><label>Tanggal Mulai</label><input type="date" id="tglMulai" required></div>
                <div><label>Tanggal Selesai</label><input type="date" id="tglSelesai" required></div>
            </div>

            <div style="overflow-x:auto;">
                <table id="tabelBarang">
                    <thead><tr><th width="35%">Nama Barang</th><th width="10%">Qty</th><th width="15%">Satuan</th><th width="20%">Harga (Rp)</th><th width="20%">Total (Rp)</th><th>X</th></tr></thead>
                    <tbody id="bodyBarang">
                        <tr>
                            <td><input type="text" class="namaBarang" required></td>
                            <td><input type="number" class="qty" value="1" required></td>
                            <td><input type="text" class="satuan" required></td>
                            <td><input type="text" class="harga" placeholder="0" oninput="formatRupiahInput(this); hitungDuaArah(this);" required></td>
                            <td><input type="text" class="total" placeholder="0" oninput="formatRupiahInput(this); hitungDuaArah(this);" required></td>
                            <td><button type="button" class="btn btn-danger hapusBaris">X</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <button type="button" class="btn" id="tambahBaris">➕ Tambah Item</button>

            <div class="grid-2" style="margin-top:20px;">
                <div><label>📸 Foto Progress Pekerjaan</label><input type="file" id="fotoKerja" accept="image/*" multiple required></div>
                <div><label>📸 Foto Nota / Bon</label><input type="file" id="fotoNota" accept="image/*" multiple required></div>
            </div>

            <button type="submit" class="btn btn-success btn-full" id="btnSimpan">🚀 SIMPAN KE SPREADSHEET</button>
        </form>
    </div>

    <div id="monitoring-section" class="card app-section" style="display:none;">
        <h2>Dashboard Laporan & Filter Data</h2>
        
        <div class="grid-3" style="margin-bottom: 25px;">
            <div class="dash-card" style="background:var(--card-bg); border-color:#48cae4;">
                <h4 style="color:#48cae4;">Total Anggaran</h4><h2 id="sumAnggaran">Rp 0</h2>
            </div>
            <div class="dash-card" style="background:var(--card-bg); border-color:#06d6a0;">
                <h4 style="color:#06d6a0;">Sudah Terbayar</h4><h2 id="sumDibayar">Rp 0</h2>
            </div>
            <div class="dash-card" style="background:var(--card-bg); border-color:#ef476f;">
                <h4 style="color:#ef476f;">Sisa Utang</h4><h2 id="sumSisa">Rp 0</h2>
            </div>
        </div>

        <div class="card" style="padding:20px; border:1px dashed var(--btn-color);">
            <div class="grid-3">
                <div><label>Dari Tgl</label><input type="date" id="fTglMulai"></div>
                <div><label>Sampai Tgl</label><input type="date" id="fTglAkhir"></div>
                <div><label>Status</label><select id="fStatus"><option value="Semua">Semua</option><option value="Dalam Pengerjaan">Dalam Pengerjaan</option><option value="Belum Lunas / Dicicil">Belum Lunas / Dicicil</option><option value="Lunas / Selesai">Lunas / Selesai</option></select></div>
                <div><label>PIC</label><select id="fPIC"><option value="Semua">Semua PIC</option></select></div>
                <div><label>Dapur</label><select id="fDapur"><option value="Semua">Semua Dapur</option></select></div>
                <div style="display:flex; gap:10px; align-items:flex-end; margin-bottom:15px;">
                    <button class="btn btn-success" style="flex:1;" onclick="terapkanFilter()">🔍 Cari</button>
                    <button class="btn btn-danger" style="flex:1;" onclick="resetFilter()">Reset</button>
                </div>
            </div>
        </div>

        <div id="printPanel" style="display:none; margin-bottom: 20px;" class="action-bar">
            <button class="btn btn-success" onclick="bukaCetak('sp')">🖨️ Cetak SP</button>
            <button class="btn btn-success" onclick="bukaCetak('invoice')">🧾 Cetak Invoice</button>
            <button class="btn btn-success" onclick="bukaCetak('lampiran')">🖼️ Cetak Lampiran Foto</button>
        </div>

        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>No</th><th>Tgl</th><th>Dapur</th><th>PIC</th><th>Anggaran</th><th>Dibayar</th><th>Sisa</th><th>Status</th><th>Aksi</th></tr></thead>
                <tbody id="tabelMonitor"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js')); }

    let dbPesanan = JSON.parse(localStorage.getItem('cache_pesanan')) || [];
    let dbMonitor = JSON.parse(localStorage.getItem('cache_monitoring')) || [];
    let aktifNoUrutBayar = null; // Menyimpan ID data yg sedang mau dibayar

    // ================= CUSTOM UI SYSTEM =================
    function tampilAlert(msg) { document.getElementById('alertMessage').innerText = msg; document.getElementById('alertOverlay').style.display = 'block'; document.getElementById('customAlert').style.display = 'block'; }
    function tutupAlert() { document.getElementById('alertOverlay').style.display = 'none'; document.getElementById('customAlert').style.display = 'none'; }
    
    function tampilPrompt(noUrut, sisa) { 
        aktifNoUrutBayar = noUrut;
        document.getElementById('promptDesc').innerHTML = `Nominal Sisa Tagihan:<br><b style="font-size:1.1rem; color:#fff;">Rp ${sisa.toLocaleString('id-ID')}</b>`;
        document.getElementById('promptInput').value = '';
        document.getElementById('promptOverlay').style.display = 'block'; document.getElementById('customPrompt').style.display = 'block'; 
    }
    function tutupPrompt() { document.getElementById('promptOverlay').style.display = 'none'; document.getElementById('customPrompt').style.display = 'none'; }

    // ================= SINKRONISASI CLOUD LENGKAP =================
    async function sinkronisasiDataCloud() {
        if(!navigator.onLine) return tampilAlert("Gagal: Tidak ada koneksi internet!");
        const btn = document.getElementById('btnSync'); btn.innerText = "🔄 Menarik Data...";
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            dbPesanan = data.pesanan || [];
            dbMonitor = data.monitoring || [];
            localStorage.setItem('cache_pesanan', JSON.stringify(dbPesanan));
            localStorage.setItem('cache_monitoring', JSON.stringify(dbMonitor));
            bangunFilter(); renderTabel(dbMonitor);
            tampilAlert("Sukses! Data telah tersinkronisasi dari Cloud Spreadsheet.");
        } catch (e) { tampilAlert("Gagal Sinkronisasi: Pastikan URL API benar dan di-deploy tipe 'Siapa Saja'."); }
        finally { btn.innerText = "🔄 Sinkron Cloud"; }
    }

    document.addEventListener("DOMContentLoaded", () => {
        muatSetting(); bangunFilter(); renderTabel(dbMonitor);
        // Otomatis tarik data diam-diam di background kalau online
        if(navigator.onLine && API_URL.includes("http")) sinkronisasiDataCloud();
    });

    function showSection(id) {
        document.querySelectorAll('.app-section').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        if(id === 'monitoring-section') { bangunFilter(); renderTabel(dbMonitor); }
    }

    // ================= PENGATURAN =================
    function simpanSetting() {
        const conf = { lok: document.getElementById('setLokasi').value, jab: document.getElementById('setJabatan').value, bnk: document.getElementById('setBank').value, rek: document.getElementById('setNoRek').value, an: document.getElementById('setAtasNama').value };
        localStorage.setItem('smm_setting', JSON.stringify(conf)); tampilAlert("Pengaturan berhasil disimpan.");
    }
    function muatSetting() {
        const d = JSON.parse(localStorage.getItem('smm_setting')) || {};
        document.getElementById('setLokasi').value = d.lok || ''; document.getElementById('setJabatan').value = d.jab || '';
        document.getElementById('setBank').value = d.bnk || ''; document.getElementById('setNoRek').value = d.rek || ''; document.getElementById('setAtasNama').value = d.an || '';
    }

    // ================= FORMAT & KALKULASI RUPIAH =================
    function formatRupiahStr(angka) {
        let number_string = angka.toString().replace(/[^,\d]/g, ''), split = number_string.split(','), sisa = split[0].length % 3, rupiah = split[0].substr(0, sisa), ribuan = split[0].substr(sisa).match(/\d{3}/gi);
        if(ribuan){ let separator = sisa ? '.' : ''; rupiah += separator + ribuan.join('.'); }
        return rupiah;
    }
    function unformat(str) { return parseFloat(str.replace(/\./g, '')) || 0; }
    
    function formatRupiahInput(elem) { elem.value = formatRupiahStr(elem.value); }

    function hitungDuaArah(elem) {
        const r = elem.closest('tr'); const qty = parseFloat(r.querySelector('.qty').value)||0; 
        const hrgElem = r.querySelector('.harga'); const totElem = r.querySelector('.total');
        if(elem.classList.contains('harga') || elem.classList.contains('qty')) {
            totElem.value = formatRupiahStr(Math.round(qty * unformat(hrgElem.value)));
        } else if(elem.classList.contains('total')) {
            hrgElem.value = formatRupiahStr(qty>0 ? Math.round(unformat(totElem.value)/qty) : 0);
        }
    }

    document.getElementById('tambahBaris').addEventListener('click', () => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><input type="text" class="namaBarang" required></td><td><input type="number" class="qty" value="1" required></td><td><input type="text" class="satuan" required></td><td><input type="text" class="harga" placeholder="0" oninput="formatRupiahInput(this); hitungDuaArah(this);" required></td><td><input type="text" class="total" placeholder="0" oninput="formatRupiahInput(this); hitungDuaArah(this);" required></td><td><button type="button" class="btn btn-danger hapusBaris">X</button></td>`;
        document.getElementById('bodyBarang').appendChild(tr);
    });
    document.getElementById('bodyBarang').addEventListener('click', e => { if(e.target.classList.contains('hapusBaris')) { if(document.querySelectorAll('#bodyBarang tr').length > 1) e.target.closest('tr').remove(); else tampilAlert("Minimal 1 item!"); }});

    // ================= KOMPRESOR & SUBMIT =================
    function kompresFoto(file) {
        return new Promise((resolve) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas'); const MAX_WIDTH = 800;
                    let w = img.width, h = img.height; if (w > MAX_WIDTH) { h = Math.round((h * MAX_WIDTH) / w); w = MAX_WIDTH; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
            };
        });
    }

    document.getElementById('formUtama').addEventListener('submit', async (e) => {
        e.preventDefault(); const btn = document.getElementById('btnSimpan'); btn.innerText = "MENGOMPRES & MENGIRIM..."; btn.disabled = true;
        try {
            let items = [], tAng = 0;
            document.querySelectorAll('#bodyBarang tr').forEach(r => {
                let tot = unformat(r.querySelector('.total').value); tAng += tot;
                items.push({ namaBarang: r.querySelector('.namaBarang').value, qty: r.querySelector('.qty').value, satuan: r.querySelector('.satuan').value, hargaSatuan: unformat(r.querySelector('.harga').value), total: tot });
            });

            let arrKerja = [], arrNota = [];
            for(let f of document.getElementById('fotoKerja').files) arrKerja.push(await kompresFoto(f));
            for(let f of document.getElementById('fotoNota').files) arrNota.push(await kompresFoto(f));

            const pic = document.getElementById('pic').value, dpr = document.getElementById('namaDapur').value, tM = document.getElementById('tglMulai').value, tS = document.getElementById('tglSelesai').value;
            
            // PENTING: Bikin NoUrut berdasarkan Timestamp agar Unik buat semua Device
            const noU = new Date().getTime(); 

            dbMonitor.push({ noUrut: noU, tglMulai: tM, namaDapur: dpr, pic: pic, anggaranAwal: tAng, dibayar: 0, sisa: tAng, status: "Dalam Pengerjaan" });
            items.forEach(it => dbPesanan.push({ noUrut: noU, tglMulai: tM, tglSelesai: tS, namaDapur: dpr, pic: pic, ...it, fotoKerja: arrKerja, fotoNota: arrNota }));
            
            localStorage.setItem('cache_pesanan', JSON.stringify(dbPesanan)); localStorage.setItem('cache_monitoring', JSON.stringify(dbMonitor));

            if(navigator.onLine) {
                // Hapus mode no-cors, gunakan text/plain agar tembus Google API
                await fetch(API_URL, { method: "POST", headers:{"Content-Type": "text/plain"}, body: JSON.stringify({ action: "simpanPesanan", noUrut: noU, namaDapur: dpr, pic: pic, tglMulai: tM, tglSelesai: tS, items, fotoKerjaBase64: arrKerja, fotoNotaBase64: arrNota, anggaranAwal: tAng }) });
                tampilAlert("Berhasil! Data & Foto telah tersimpan ke Google Sheet.");
            } else tampilAlert("Disimpan di lokal (Sedang Offline).");

            document.getElementById('formUtama').reset(); 
            document.getElementById('bodyBarang').innerHTML = `<tr><td><input type="text" class="namaBarang" required></td><td><input type="number" class="qty" value="1" required></td><td><input type="text" class="satuan" required></td><td><input type="text" class="harga" placeholder="0" oninput="formatRupiahInput(this); hitungDuaArah(this);" required></td><td><input type="text" class="total" placeholder="0" oninput="formatRupiahInput(this); hitungDuaArah(this);" required></td><td><button type="button" class="btn btn-danger hapusBaris">X</button></td></tr>`;
            showSection('monitoring-section');
        } catch(err) { tampilAlert("Gagal: " + err.message); } finally { btn.innerText = "🚀 SIMPAN KE SPREADSHEET"; btn.disabled = false; }
    });

    // ================= DASHBOARD & PEMBAYARAN =================
    function bangunFilter() {
        const fp = document.getElementById('fPIC'), fd = document.getElementById('fDapur');
        fp.innerHTML = '<option value="Semua">Semua PIC</option>'; fd.innerHTML = '<option value="Semua">Semua Dapur</option>';
        [...new Set(dbMonitor.map(i=>i.pic))].forEach(p => fp.innerHTML += `<option value="${p}">${p}</option>`);
        [...new Set(dbMonitor.map(i=>i.namaDapur))].forEach(d => fd.innerHTML += `<option value="${d}">${d}</option>`);
    }

    function terapkanFilter() {
        let tM = document.getElementById('fTglMulai').value, tA = document.getElementById('fTglAkhir').value, st = document.getElementById('fStatus').value, p = document.getElementById('fPIC').value, d = document.getElementById('fDapur').value;
        let hasil = dbMonitor.filter(i => {
            let ok = true;
            if(p !== "Semua" && i.pic !== p) ok = false; if(d !== "Semua" && i.namaDapur !== d) ok = false; if(st !== "Semua" && i.status !== st) ok = false;
            if(tM && i.tglMulai < tM) ok = false; if(tA && i.tglMulai > tA) ok = false;
            return ok;
        });
        renderTabel(hasil);
        
        if(hasil.length === 1 && p !== "Semua" && d !== "Semua") {
            localStorage.setItem('smm_siap_cetak', JSON.stringify({ bundle: hasil[0], items: dbPesanan.filter(x => String(x.noUrut) === String(hasil[0].noUrut)) }));
            document.getElementById('printPanel').style.display = 'flex';
        } else document.getElementById('printPanel').style.display = 'none';
    }

    function resetFilter() { document.getElementById('fTglMulai').value=''; document.getElementById('fTglAkhir').value=''; document.getElementById('fStatus').value='Semua'; document.getElementById('fPIC').value='Semua'; document.getElementById('fDapur').value='Semua'; document.getElementById('printPanel').style.display='none'; renderTabel(dbMonitor); }

    function renderTabel(data) {
        let tA=0, tD=0, tS=0; const tb = document.getElementById('tabelMonitor'); tb.innerHTML = '';
        data.forEach(x => { tA+=Number(x.anggaranAwal)||0; tD+=Number(x.dibayar)||0; tS+=(x.sisa!==undefined?Number(x.sisa):Number(x.anggaranAwal)); });
        document.getElementById('sumAnggaran').innerText = `Rp ${tA.toLocaleString('id-ID')}`; document.getElementById('sumDibayar').innerText = `Rp ${tD.toLocaleString('id-ID')}`; document.getElementById('sumSisa').innerText = `Rp ${tS.toLocaleString('id-ID')}`;
        
        if(!data.length) return tb.innerHTML = '<tr><td colspan="9" align="center">Belum ada riwayat.</td></tr>';
        data.forEach(x => {
            let bdg = x.status.includes('Lunas')?'badge-lunas':x.status.includes('Cicil')?'badge-cicil':'badge-progress';
            // Cek No urut panjang (timestamp) di slice aja buat UI
            let printNo = String(x.noUrut).length > 8 ? String(x.noUrut).slice(-4) : x.noUrut;
            tb.innerHTML += `<tr><td>#${printNo}</td><td>${x.tglMulai}</td><td>${x.namaDapur}</td><td>${x.pic}</td><td>Rp ${(Number(x.anggaranAwal)||0).toLocaleString('id-ID')}</td><td style="color:#06d6a0;">Rp ${(Number(x.dibayar)||0).toLocaleString('id-ID')}</td><td style="color:#ef476f;">Rp ${(x.sisa!==undefined?Number(x.sisa):Number(x.anggaranAwal)).toLocaleString('id-ID')}</td><td><span class="badge ${bdg}">${x.status}</span></td><td><button class="btn btn-success" style="padding:8px;" onclick="persiapanBayar('${x.noUrut}')">Bayar</button></td></tr>`;
        });
    }

    function persiapanBayar(no) {
        let idx = dbMonitor.findIndex(x => String(x.noUrut) === String(no)); 
        if(idx===-1) return;
        let d = dbMonitor[idx]; 
        tampilPrompt(d.noUrut, d.sisa !== undefined ? d.sisa : d.anggaranAwal);
    }

    async function submitBayar() {
        let j = unformat(document.getElementById('promptInput').value);
        if(j <= 0) return tampilAlert("Masukkan angka yang valid!");
        
        let idx = dbMonitor.findIndex(x => String(x.noUrut) === String(aktifNoUrutBayar));
        let d = dbMonitor[idx];
        
        d.dibayar = (Number(d.dibayar)||0) + j; 
        d.sisa = Number(d.anggaranAwal) - d.dibayar;
        if(d.sisa<=0){d.sisa=0; d.status="Lunas / Selesai";} else d.status="Belum Lunas / Dicicil";
        
        dbMonitor[idx] = d; 
        localStorage.setItem('cache_monitoring', JSON.stringify(dbMonitor)); 
        
        // Push Ke Cloud
        if(navigator.onLine && API_URL.includes("http")) {
            try {
                await fetch(API_URL, { method: "POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({ action: "updatePembayaran", noUrut: d.noUrut, dibayar: d.dibayar, sisa: d.sisa, status: d.status }) });
            } catch(e) {}
        }
        
        tutupPrompt(); terapkanFilter(); tampilAlert("Pembayaran sukses dicatat!");
    }

    function bukaCetak(j) { window.open(`${j}.html`, '_blank'); }
</script>
</body>
</html>
