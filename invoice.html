<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><title>Invoice</title>
  <style>
    @page { size: A4; margin: 15mm 18mm; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:'Times New Roman',Times,serif; font-size:11pt; color:#111; line-height:1.5; }
    .kop{ margin-bottom:12px; border-bottom:3px double #000; padding-bottom:8px; }
    .kop img{ width:100%; height:auto; display:block; }
    .doc-title{ text-align:center; margin:14px 0 4px; }
    .doc-title h2{ font-size:13pt; font-weight:bold; text-decoration:underline; letter-spacing:1px; }
    .info{ width:100%; border-collapse:collapse; margin-bottom:18px; font-size:10.5pt; }
    .info td{ padding:2px 6px 2px 0; vertical-align:top; }
    .info td:nth-child(odd){ font-weight:bold; width:110px; }
    table.items{ width:100%; border-collapse:collapse; margin-bottom:8px; font-size:10.5pt; }
    table.items th{ background:#2c3e50; color:#fff; padding:7px 8px; border:1px solid #2c3e50; }
    table.items td{ border:1px solid #bbb; padding:6px 8px; }
    table.items tfoot td{ border:1px solid #888; padding:7px 8px; background:#eef2f5; font-weight:bold; }
    .tc{ text-align:center; } .tr{ text-align:right; }
    .transfer{ border:1px dashed #333; padding:10px 14px; margin-bottom:20px; font-size:10pt; }
    .ttd-box{ width:46%; text-align:center; float:right; margin-top:20px; }
    .ttd-box .ruang{ height:60px; border-bottom:1px solid #555; margin:8px 20px; }
    @media print{ .no-print{ display:none!important; } }
    .no-print{ position:fixed; bottom:20px; right:20px; display:flex; gap:10px; }
    .btnP{ padding:10px 22px; border:none; border-radius:8px; background:#2c3e50; color:#fff; font-weight:bold; cursor:pointer;}
  </style>
</head>
<body>
<div class="kop" id="kopEl"></div>
<div class="doc-title"><h2>INVOICE PEMBAYARAN</h2></div>
<div style="text-align:center;font-size:10pt;margin-bottom:18px">Nomor: <b id="noDoc">—</b></div>

<table class="info">
  <tr><td>Nama Dapur</td><td>: <span id="iDapur"></span></td><td>PIC</td><td>: <span id="iPIC"></span></td></tr>
  <tr><td>Status</td><td>: <span id="iStatus"></span></td><td>Periode</td><td>: <span id="iPeriode"></span></td></tr>
</table>

<table class="items">
  <thead><tr><th style="width:32px">No</th><th>Barang / Pekerjaan</th><th style="width:45px">Qty</th><th style="width:60px">Sat</th><th style="width:115px">Harga</th><th style="width:115px">Total (Rp)</th></tr></thead>
  <tbody id="invBody"></tbody>
  <tfoot>
    <tr><td colspan="5" class="tr">TOTAL BIAYA</td><td class="tr" id="invTotal">Rp 0</td></tr>
    <tr><td colspan="5" class="tr">Terbayar</td><td class="tr" id="invBayar" style="color:#27ae60">Rp 0</td></tr>
    <tr><td colspan="5" class="tr">Sisa Tagihan</td><td class="tr" id="invSisa" style="color:#c0392b">Rp 0</td></tr>
  </tfoot>
</table>

<div class="transfer">
  <b>REKENING TUJUAN & RIWAYAT PEMBAYARAN:</b><br>
  Bank <span id="tBank">—</span> | No. Rek: <span id="tRek">—</span> | A/N: <span id="tAN">—</span><br>
  <div id="riwayatBayar" style="margin-top:8px;font-size:9pt;color:#444"></div>
</div>

<div class="ttd-box">
  <div id="tKota">—</div><div style="font-weight:bold" id="tJab">—</div>
  <div class="ruang"></div><div style="font-weight:bold;text-decoration:underline" id="tNama">—</div>
</div>
<div class="no-print"><button class="btnP" onclick="window.print()">Cetak</button></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const d = JSON.parse(localStorage.getItem('smm_siap_cetak'));
  const s = JSON.parse(localStorage.getItem('smm_setting') || '{}');
  if(!d) return;
  const b = d.bundle, items = d.items||[];
  const rp = n => (Number(n)||0).toLocaleString('id-ID');
  
  if(s.kop && s.kop !== 'Kop.png') document.getElementById('kopEl').innerHTML = `<img src="${s.kop}">`;
  else document.getElementById('kopEl').innerHTML = `<h1 style="text-align:center">SMM DAPUR MBG</h1>`;
  
  document.getElementById('noDoc').innerText = `INV/${String(b.noUrut).slice(-4)}/MBG/${new Date().getFullYear()}`;
  document.getElementById('iDapur').innerText = b.namaDapur; document.getElementById('iPIC').innerText = b.pic;
  document.getElementById('iStatus').innerText = b.status; document.getElementById('iPeriode').innerText = b.tglMulai;
  
  let tot=0, html='';
  items.forEach((it,i) => { tot+=Number(it.total)||0; html+=`<tr><td class="tc">${i+1}</td><td>${it.namaBarang}</td><td class="tc">${it.qty}</td><td>${it.satuan}</td><td class="tr">Rp ${rp(it.hargaSatuan)}</td><td class="tr">Rp ${rp(it.total)}</td></tr>`; });
  document.getElementById('invBody').innerHTML = html;
  
  document.getElementById('invTotal').innerText = 'Rp ' + rp(b.anggaranAwal);
  document.getElementById('invBayar').innerText = 'Rp ' + rp(b.dibayar);
  document.getElementById('invSisa').innerText = 'Rp ' + rp(b.sisa);
  
  // Ambil bank dari transaksi jika ada, jika tidak fallback ke setting
  document.getElementById('tBank').innerText = b.bankNama || s.bnk || '—';
  document.getElementById('tRek').innerText = b.bankRek || s.rek || '—';
  document.getElementById('tAN').innerText = b.bankAn || s.an || '—';
  
  // Riwayat cicilan
  let riwayat = "";
  if(b.tglTerbayar && Array.isArray(b.tglTerbayar) && b.tglTerbayar.length > 0){
    b.tglTerbayar.forEach((t, i) => {
      let dana = b.sumberDana && b.sumberDana[i] ? b.sumberDana[i] : 'Unknown';
      riwayat += `- Tgl: ${t} (${dana})<br>`;
    });
    document.getElementById('riwayatBayar').innerHTML = "Riwayat Cicilan:<br>" + riwayat;
  }
  
  const tglCetak = new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
  document.getElementById('tKota').innerText = `${s.lok||'Kota'}, ${tglCetak}`;
  document.getElementById('tJab').innerText = s.jab || 'Koordinator';
  document.getElementById('tNama').innerText = s.jab || '—';
  
  setTimeout(()=>window.print(), 800);
});
</script>
</body></html>
