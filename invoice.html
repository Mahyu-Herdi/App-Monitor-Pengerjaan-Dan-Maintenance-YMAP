<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Invoice Pembayaran</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @page { size: A4 portrait; margin: 10mm 15mm; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html, body { height: 100%; font-family:'Times New Roman',Times,serif; font-size:10.5pt; color:#111; background:#fff; line-height:1.45; }
    #printWrapper { width: 100%; max-width: 190mm; margin: 0 auto; background: #fff; page-break-inside: avoid; }
    
    .kop{ margin-bottom:10px; border-bottom:3px double #000; padding-bottom:6px; }
    .kop img{ width:100%; max-height:160px; object-fit:contain; object-position: center top; display:block; }
    .kop-fallback{ text-align:center; padding:8px 0; }
    .kop-fallback h1{ font-size:13.5pt; font-weight:bold; margin:0; }
    .kop-fallback p{ font-size:8.5pt; color:#555; margin:2px 0; }
    
    .doc-title{ text-align:center; margin:8px 0 2px; }
    .doc-title h2{ font-size:12.5pt; font-weight:bold; text-decoration:underline; letter-spacing:1px; }
    .doc-no{ text-align:center; font-size:9.5pt; color:#444; margin-bottom:10px; }
    
    .info{ width:100%; border-collapse:collapse; margin-bottom:10px; font-size:10pt; background:#fafafa; border:1px solid #ddd; border-radius:4px; padding:6px 10px; }
    .info td{ padding:2px 6px 2px 0; vertical-align:top; }
    .info td:nth-child(odd){ font-weight:bold; width:115px; }
    
    table.items{ width:100%; border-collapse:collapse; margin-bottom:8px; font-size:10pt; }
    table.items th{ background:#2c3e50; color:#fff; padding:6px 6px; border:1px solid #2c3e50; font-size:9.5pt; }
    table.items td{ border:1px solid #bbb; padding:5px 6px; }
    table.items tbody tr:nth-child(even){ background:#f9f9f9; }
    table.items tfoot td{ border:1px solid #888; padding:6px 8px; background:#eef2f5; font-weight:bold; }
    .tc{ text-align:center; } .tr{ text-align:right; }
    
    .transfer{ border:1px dashed #333; padding:8px 12px; margin-bottom:14px; font-size:9.5pt; border-radius:4px; }
    .ttd-box{ width:46%; text-align:center; float:right; margin-top:10px; font-size:10pt; }
    .ttd-box .ruang{ height:48px; border-bottom:1px solid #555; margin:6px 20px; }
    
    /* LOADING OVERLAY */
    #loadingToast { display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#2c3e50; color:#fff; padding:10px 20px; border-radius:30px; font-size:13px; font-weight:bold; z-index:10000; box-shadow:0 4px 15px rgba(0,0,0,0.25); font-family:sans-serif; align-items:center; gap:8px; }
    
    @media print{
      .no-print{ display:none!important; }
      body { background: #fff; padding: 0; margin: 0; }
      #printWrapper { width: 100%; max-width: 100%; }
    }
    
    .no-print{
      position:fixed; bottom:18px; right:18px; display:flex; gap:8px; z-index:99;
      background:rgba(255,255,255,0.92); backdrop-filter:blur(6px); padding:8px 12px;
      border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.18); border:1px solid #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .btnP{
      padding:9px 15px; border:none; border-radius:8px; font-size:12.5px; font-weight:bold;
      cursor:pointer; background:#2c3e50; color:#fff; display:inline-flex; align-items:center; gap:6px;
      transition:background 0.15s, transform 0.1s;
    }
    .btnP:hover{ transform: translateY(-1px); }
    .btnP.green{ background:#27ae60; }
    .btnP.blue{ background:#2980b9; }
    .btnP.orange{ background:#d35400; }
    
    .riwayat-item{ margin-bottom:3px; padding:2px 0; border-bottom:1px dotted #ddd; }
  </style>
</head>
<body>

<div id="loadingToast">
  <svg width="18" height="18" viewBox="0 0 24 24" style="animation:spin 1s linear infinite;fill:#fff"><circle cx="12" cy="12" r="10" stroke="#fff" stroke-width="4" fill="none" stroke-dasharray="31.4 31.4"/></svg>
  <span id="loadingMsg">Memproses PDF...</span>
</div>

<style>
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>

<div id="printWrapper">
  <div class="kop" id="kopEl"></div>
  <div class="doc-title"><h2>INVOICE PEMBAYARAN</h2></div>
  <div class="doc-no">Nomor: <b id="noDoc">—</b></div>

  <table class="info">
    <tr><td>Proyek / Uraian</td><td colspan="3">: <span id="iJudulProyek" style="font-weight:bold;font-size:10.5pt"></span></td></tr>
    <tr><td>Nama Dapur</td><td>: <span id="iDapur"></span></td><td>PIC</td><td>: <span id="iPIC"></span></td></tr>
    <tr><td>Status</td><td>: <span id="iStatus"></span></td><td>Tgl. Mulai</td><td>: <span id="iPeriode"></span></td></tr>
  </table>

  <table class="items">
    <thead><tr><th style="width:28px">No</th><th>Barang / Pekerjaan</th><th style="width:42px">Qty</th><th style="width:60px">Sat</th><th style="width:110px">Harga Satuan</th><th style="width:115px">Total (Rp)</th></tr></thead>
    <tbody id="invBody"></tbody>
    <tfoot>
      <tr><td colspan="5" class="tr">TOTAL BIAYA</td><td class="tr" id="invTotal">Rp 0</td></tr>
      <tr><td colspan="5" class="tr">Terbayar</td><td class="tr" id="invBayar" style="color:#27ae60">Rp 0</td></tr>
      <tr><td colspan="5" class="tr">Sisa Tagihan</td><td class="tr" id="invSisa" style="color:#c0392b">Rp 0</td></tr>
    </tfoot>
  </table>

  <div class="transfer">
    <b>REKENING TUJUAN & RIWAYAT PEMBAYARAN:</b><br>
    Bank <span id="tBank">—</span> | No. Rek: <span id="tRek">—</span> | A/N: <span id="tAN">—</span><br>
    <div id="riwayatBayar" style="margin-top:6px;font-size:8.5pt;color:#444"></div>
  </div>

  <div class="ttd-box">
    <div id="tKota">—</div>
    <div style="font-weight:bold" id="tJab">—</div>
    <div class="ruang"></div>
    <div style="font-weight:bold;text-decoration:underline" id="tNama">—</div>
  </div>
  <div style="clear:both"></div>
</div>

<div class="no-print">
  <button class="btnP green" onclick="cetakDokumen()">
    <svg style="width:15px;height:15px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg> Cetak
  </button>
  <button class="btnP blue" onclick="unduhPDF()">
    <svg style="width:15px;height:15px;fill:currentColor" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg> Unduh PDF
  </button>
  <button class="btnP orange" onclick="sharePDF()">
    <svg style="width:15px;height:15px;fill:currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Kirim WA (PDF)
  </button>
</div>

<script>
let tglCetakGlobal = '';
let namaDapurGlobal = '';
let judulProyekGlobal = '';

function formatTglLengkap(tglStr) {
  if (!tglStr || tglStr === '—') return '—';
  const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  let tgl;
  if (typeof tglStr === 'number') {
    tgl = new Date(tglStr);
  } else if (typeof tglStr === 'string' && tglStr.match(/^\d{4}-\d{2}-\d{2}$/)) {
    const parts = tglStr.split('-');
    tgl = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  } else {
    tgl = new Date(tglStr);
  }
  if (isNaN(tgl.getTime())) return String(tglStr);
  return `${String(tgl.getDate()).padStart(2,'0')} ${bulan[tgl.getMonth()]} ${tgl.getFullYear()}`;
}

const rp = n => (Number(n)||0).toLocaleString('id-ID');

function sesuaikanSatuHalaman() {
  const wrap = document.getElementById("printWrapper");
  if (!wrap) return;
  
  wrap.style.zoom = '1';
  wrap.style.transform = 'none';
  
  const maxH = 1000;
  const curH = wrap.scrollHeight || wrap.offsetHeight;
  
  if (curH > maxH) {
    const scale = Math.max(0.60, Math.floor((maxH / curH) * 100) / 100);
    wrap.style.zoom = scale;
    
    document.querySelectorAll('table.items td, table.items th').forEach(td => {
      td.style.padding = '3px 5px';
    });
    const trf = document.querySelector('.transfer');
    if (trf) { trf.style.padding = '5px 8px'; trf.style.marginBottom = '8px'; }
  }
}

function cetakDokumen() {
  sesuaikanSatuHalaman();
  window.print();
}

function tampilkanLoading(pesan) {
  const toast = document.getElementById('loadingToast');
  document.getElementById('loadingMsg').innerText = pesan || 'Memproses...';
  toast.style.display = 'flex';
}

function sembunyikanLoading() {
  document.getElementById('loadingToast').style.display = 'none';
}

function getSafeFileName() {
  const d = (namaDapurGlobal || 'Dapur').replace(/[/\\?%*:|"<>]/g, '-').trim();
  const p = (judulProyekGlobal || 'Proyek').replace(/[/\\?%*:|"<>]/g, '-').trim();
  return `Invoice - ${d} - ${p}`;
}

async function unduhPDF() {
  sesuaikanSatuHalaman();
  tampilkanLoading('Menyiapkan file PDF...');
  
  const fileName = `${getSafeFileName()}.pdf`;
  const el = document.getElementById('printWrapper');
  
  const opt = {
    margin: [8, 12, 8, 12],
    filename: fileName,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, logging: false },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  
  try {
    if (typeof html2pdf !== 'undefined') {
      await html2pdf().set(opt).from(el).save();
    } else {
      window.print();
    }
  } catch(e) {
    console.error(e);
    window.print();
  } finally {
    sembunyikanLoading();
  }
}

async function sharePDF() {
  sesuaikanSatuHalaman();
  tampilkanLoading('Membuat PDF untuk WhatsApp / Share...');
  
  const fileName = `${getSafeFileName()}.pdf`;
  const el = document.getElementById('printWrapper');
  
  const opt = {
    margin: [8, 12, 8, 12],
    filename: fileName,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, logging: false },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  
  try {
    if (typeof html2pdf !== 'undefined') {
      const pdfBlob = await html2pdf().set(opt).from(el).outputPdf('blob');
      sembunyikanLoading();
      
      const file = new File([pdfBlob], fileName, { type: 'application/pdf' });
      
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          title: fileName,
          text: `Berikut kami kirimkan Invoice Pembayaran:\n*${judulProyekGlobal}* di *${namaDapurGlobal}*.`,
          files: [file]
        });
      } else {
        const url = URL.createObjectURL(pdfBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        
        const waText = encodeURIComponent(`Halo, terlampir dokumen Invoice Pembayaran:\n*${getSafeFileName()}*\n\n(File PDF sudah otomatis terunduh di perangkat Anda dan siap dilampirkan).`);
        window.open(`https://api.whatsapp.com/send?text=${waText}`, '_blank');
      }
    } else {
      sembunyikanLoading();
      window.print();
    }
  } catch(e) {
    sembunyikanLoading();
    console.error(e);
    window.print();
  }
}

function loadKop(kopUrl, cb) {
  const el = document.getElementById('kopEl');
  if (!kopUrl || kopUrl.trim() === '' || kopUrl === 'Kop.png') {
    const img = new Image();
    img.onload = () => { el.innerHTML = `<img src="Kop.png" alt="Kop Surat">`; if(cb) cb(); };
    img.onerror = () => { el.innerHTML = `<div class="kop-fallback"><h1>YAYASAN MUSLIM ACEH PEDULI</h1><p>Pembangunan Dan Pusat Admininistrasi (MAP)</p></div>`; if(cb) cb(); };
    img.src = 'Kop.png';
  } else {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { el.innerHTML = `<img src="${kopUrl}" alt="Kop Surat">`; if(cb) cb(); };
    img.onerror = () => {
      const img2 = new Image();
      img2.onload = () => { el.innerHTML = `<img src="Kop.png" alt="Kop Surat">`; if(cb) cb(); };
      img2.onerror = () => { el.innerHTML = `<div class="kop-fallback"><h1>YAYASAN MUSLIM ACEH PEDULI</h1></div>`; if(cb) cb(); };
      img2.src = 'Kop.png';
    };
    img.src = kopUrl;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const d = JSON.parse(localStorage.getItem('smm_siap_cetak'));
  const s = JSON.parse(localStorage.getItem('smm_setting') || '{}');
  if(!d) {
    document.body.innerHTML = '<h3 style="padding:20px;text-align:center;">Data kosong. Silakan kembali ke aplikasi dan pilih proyek.</h3>';
    return;
  }

  const b = d.bundle, items = d.items||[];
  tglCetakGlobal = formatTglLengkap(new Date().toISOString().slice(0,10));
  namaDapurGlobal = b.namaDapur || s.lok || 'Dapur';
  judulProyekGlobal = b.judulProyek || 'Pekerjaan Umum';

  // SET DYNAMIC DOCUMENT TITLE WITH DAPUR & PROYEK
  document.title = getSafeFileName();

  document.getElementById('noDoc').innerText = `INV/${String(b.noUrut).slice(-4)}/MAP/${new Date().getFullYear()}`;
  document.getElementById('iJudulProyek').innerText = (b.judulProyek || 'PEKERJAAN UMUM').toUpperCase();
  document.getElementById('iDapur').innerText = b.namaDapur || '—';
  document.getElementById('iPIC').innerText = b.pic || '—';
  document.getElementById('iStatus').innerText = b.status || '—';
  document.getElementById('iPeriode').innerText = formatTglLengkap(b.tglMulai);

  let tot=0, html='';
  items.forEach((it,i) => {
    tot += Number(it.total)||0;
    html += `<tr>
      <td class="tc">${i+1}</td>
      <td>${it.namaBarang}</td>
      <td class="tc">${it.qty}</td>
      <td>${it.satuan}</td>
      <td class="tr">Rp ${rp(it.hargaSatuan)}</td>
      <td class="tr">Rp ${rp(it.total)}</td>
    </tr>`;
  });
  document.getElementById('invBody').innerHTML = html;

  document.getElementById('invTotal').innerText = 'Rp ' + rp(b.anggaranAwal);
  document.getElementById('invBayar').innerText = 'Rp ' + rp(b.dibayar);
  document.getElementById('invSisa').innerText = 'Rp ' + rp(b.sisa);

  // Info bank
  document.getElementById('tBank').innerText = s.bnk || b.bankNama || '—';
  document.getElementById('tRek').innerText = s.rek || b.bankRek || '—';
  document.getElementById('tAN').innerText = s.an || b.bankAn || '—';

  // Riwayat cicilan
  let riwayat = '';
  if(b.tglTerbayar && Array.isArray(b.tglTerbayar) && b.tglTerbayar.length > 0){
    riwayat = '<b>Riwayat Pembayaran:</b><br>';
    b.tglTerbayar.forEach((t, i) => {
      let dana = (b.sumberDana && b.sumberDana[i]) ? b.sumberDana[i] : '-';
      riwayat += `<div class="riwayat-item">${i+1}. Tanggal: ${formatTglLengkap(t)} &nbsp;|&nbsp; Keterangan: ${dana}</div>`;
    });
    document.getElementById('riwayatBayar').innerHTML = riwayat;
  }

  // TTD
  document.getElementById('tKota').innerText = `${s.lok||'Kota'}, ${tglCetakGlobal}`;
  document.getElementById('tJab').innerText = s.jab || 'Koordinator';
  document.getElementById('tNama').innerText = s.an || s.jab || '—';

  loadKop(s.kop, () => {
    sesuaikanSatuHalaman();
  });
});
</script>
</body>
</html>
