<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Invoice Pembayaran</title>
    <style>
        @page { size: A4; margin: 18mm 15mm; }
        body { font-family: 'Times New Roman', serif; margin: 0; font-size: 11pt; line-height: 1.3; }
        .kop { text-align: center; border-bottom: 3px double #000; padding-bottom: 5px; margin-bottom: 20px; }
        .kop img { max-height: 70px; }
        .kop-text { font-size: 16pt; font-weight: bold; }
        .title { text-align: center; font-size: 14pt; font-weight: bold; text-decoration: underline; }
        .nomor { text-align: center; margin-bottom: 25px; }
        table.meta-table, table.data-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        table.data-table th, table.data-table td { border: 1px solid #000; padding: 7px; }
        table.data-table th { background: #f2f2f2; text-align: center; }
        .terbilang-box { background: #fafafa; padding: 10px; font-style: italic; font-weight: bold; margin-bottom: 20px; border: 1px solid #ddd;}
        .payment-info { border: 1px dashed #000; padding: 10px; font-size: 10pt; }
        .ttd-box { float: right; width: 45%; text-align: center; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="kop"><div id="kopImage"></div><div class="kop-text">YAYASAN KEMBAR JAYA PEMELIHARAAN INFRASTRUKTUR</div></div>
    <div class="title">INVOICE TAGIHAN MAINTENANCE</div>
    <div class="nomor">Nomor: <span id="noDoc"></span></div>

    <table class="meta-table">
        <tr><td width="20%">Dapur</td><td width="30%">: <span id="lblDapur"></span></td><td width="20%">Tgl Cetak</td><td>: <span id="lblTanggal"></span></td></tr>
        <tr><td>PIC</td><td>: <span id="lblPIC"></span></td><td>Periode</td><td>: <span id="lblPeriode"></span></td></tr>
    </table>

    <table class="data-table">
        <thead><tr><th>No</th><th>Barang/Pekerjaan</th><th>Qty</th><th>Satuan</th><th>Harga</th><th>Total</th></tr></thead>
        <tbody id="invoiceItems"></tbody>
        <tfoot><tr><td colspan="5" style="text-align:right;font-weight:bold;">TOTAL BIAYA:</td><td id="lblGrandTotal" style="font-weight:bold;"></td></tr></tfoot>
    </table>

    <div><b>Terbilang:</b></div>
    <div class="terbilang-box" id="lblTerbilang"></div>

    <div class="payment-info">
        <b>INSTRUKSI TRANSFER PEMBAYARAN:</b><br>
        <span id="pilihBank"></span> | No. Rekening: <span id="pilihNoRek"></span><br>Atas Nama: <span id="pilihAtasNama"></span>
    </div>

    <div class="ttd-box">
        <span id="ttdLokasi"></span>, <span id="ttdTanggal"></span><br><span id="ttdJabatan"></span><br><br><br><b><u><span id="ttdNama"></span></u></b>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const data = JSON.parse(localStorage.getItem('smm_siap_cetak'));
        const setting = JSON.parse(localStorage.getItem('smm_setting_cetak')) || {};
        if(!data) return;

        if(setting.kop) document.getElementById('kopImage').innerHTML = `<img src="${setting.kop}">`;
        document.getElementById('lblDapur').innerText = data.bundle.namaDapur;
        document.getElementById('lblPIC').innerText = data.bundle.pic;
        document.getElementById('lblTanggal').innerText = data.bundle.tglMulai;
        document.getElementById('lblPeriode').innerText = `${data.bundle.tglMulai} s/d ${data.items[0].tglSelesai}`;
        document.getElementById('noDoc').innerText = `INV/${String(data.bundle.noUrut).padStart(3, '0')}/MBG/${new Date().getFullYear()}`;

        const tbody = document.getElementById('invoiceItems');
        data.items.forEach((it, idx) => {
            tbody.innerHTML += `<tr><td align="center">${idx+1}</td><td>${it.namaBarang}</td><td align="center">${it.qty}</td><td>${it.satuan}</td><td>Rp ${(it.hargaSatuan||0).toLocaleString('id-ID')}</td><td>Rp ${(it.total||0).toLocaleString('id-ID')}</td></tr>`;
        });

        const tot = data.bundle.anggaranAwal;
        document.getElementById('lblGrandTotal').innerText = `Rp ${tot.toLocaleString('id-ID')}`;
        document.getElementById('lblTerbilang').innerText = `# ${terbilang(tot)} Rupiah #`;

        document.getElementById('pilihBank').innerText = setting.bank || '-';
        document.getElementById('pilihNoRek').innerText = setting.norek || '-';
        document.getElementById('pilihAtasNama').innerText = setting.atasnama || '-';
        document.getElementById('ttdLokasi').innerText = setting.lokasi || 'Jakarta';
        document.getElementById('ttdTanggal').innerText = data.bundle.tglMulai;
        document.getElementById('ttdJabatan').innerText = setting.jabatan || 'Penanggung Jawab';
        document.getElementById('ttdNama').innerText = data.bundle.pic;
        setTimeout(() => window.print(), 500);
    });

    function terbilang(angka) {
        let bil = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"], temp = "";
        if(angka < 12) temp = " " + bil[angka];
        else if(angka < 20) temp = terbilang(angka - 10) + " Belas";
        else if(angka < 100) temp = terbilang(Math.floor(angka/10)) + " Puluh" + terbilang(angka%10);
        else if(angka < 200) temp = " Seratus" + terbilang(angka - 100);
        else if(angka < 1000) temp = terbilang(Math.floor(angka/100)) + " Ratus" + terbilang(angka%100);
        else if(angka < 2000) temp = " Seribu" + terbilang(angka - 1000);
        else if(angka < 1000000) temp = terbilang(Math.floor(angka/1000)) + " Ribu" + terbilang(angka%1000);
        else if(angka < 1000000000) temp = terbilang(Math.floor(angka/1000000)) + " Juta" + terbilang(angka%1000000);
        return temp.trim();
    }
</script>
</body>
</html>
