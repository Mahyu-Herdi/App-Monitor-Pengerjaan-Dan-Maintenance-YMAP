<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><title>Surat Pesanan</title>
    <style>
        @page { size: A4; margin: 15mm; }
        body { font-family: 'Times New Roman', serif; margin: 0; font-size: 11pt; }
        
        /* Kop Surat Menggunakan Trik Root File */
        .kop { margin-bottom: 20px; border-bottom: 3px double #000; padding-bottom: 5px; }
        .kop img { width: 100%; height: auto; display: block; }

        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { border: 1px solid #000; padding: 7px; } 
        th { background: #f2f2f2; text-align: center; }
        .ttd { margin-top: 50px; display: flex; justify-content: space-between; text-align: center; }
    </style>
</head>
<body>
    <div class="kop"><img src="kop.png" alt="Kop Surat"></div>

    <div style="text-align:center; font-size:14pt; font-weight:bold;">MAP - SURAT PESANAN (SP)</div>
    <div style="text-align:center; margin-bottom:20px;">Nomor: <span id="noDoc"></span></div>

    <p>Instruksi pemesanan material diarahkan kepada:</p>
    <p><b>PIC:</b> <span id="lblPIC"></span> | <b>Dapur:</b> <span id="lblDapur"></span> | <b>Tgl:</b> <span id="lblTgl"></span></p>

    <table>
        <thead><tr><th>No</th><th>Nama Barang</th><th>Qty</th><th>Satuan</th><th>Estimasi Total</th></tr></thead>
        <tbody id="spItems"></tbody>
    </table>

    <div class="ttd">
        <div style="width: 40%;">Menyetujui,<br><span id="setJabatan"></span><br><br><br><b>_________________</b></div>
        <div style="width: 40%;"><span id="setLokasi"></span>, <span id="ttdTgl"></span><br>Pelaksana Lapangan<br><br><br><b><u><span id="setNama"></span></u></b></div>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const d = JSON.parse(localStorage.getItem('smm_siap_cetak')), set = JSON.parse(localStorage.getItem('smm_setting')) || {};
        if(!d) return;
        
        let NoUrutPendek = String(d.bundle.noUrut).length > 8 ? String(d.bundle.noUrut).slice(-4) : d.bundle.noUrut;
        document.getElementById('lblPIC').innerText = d.bundle.pic; 
        document.getElementById('lblDapur').innerText = d.bundle.namaDapur; 
        document.getElementById('lblTgl').innerText = d.bundle.tglMulai;
        document.getElementById('noDoc').innerText = `MAP-SP/${String(NoUrutPendek).padStart(3, '0')}/MBG/${new Date().getFullYear()}`;
        
        let tb = ''; d.items.forEach((it, i) => tb+=`<tr><td align="center">${i+1}</td><td>${it.namaBarang}</td><td align="center">${it.qty}</td><td>${it.satuan}</td><td align="right">Rp ${(Number(it.total)||0).toLocaleString('id-ID')}</td></tr>`);
        document.getElementById('spItems').innerHTML = tb;
        
        document.getElementById('setJabatan').innerText = set.jab || 'Penanggung Jawab'; 
        document.getElementById('setLokasi').innerText = set.lok || 'Tempat'; 
        document.getElementById('ttdTgl').innerText = d.bundle.tglMulai; 
        document.getElementById('setNama').innerText = d.bundle.pic;
        setTimeout(() => window.print(), 800);
    });
</script>
</body>
</html>
