<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><title>Lampiran Foto</title>
    <style>
        @page { size: A4; margin: 15mm; }
        body { font-family: Arial, sans-serif; }
        .header { margin-bottom: 20px; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 10px;}
        .photo-card { display: inline-block; width: 45%; margin: 2%; text-align: center; border: 1px solid #ccc; padding: 5px; box-sizing: border-box; }
        .photo-card img { width: 100%; height: 220px; object-fit: contain; }
    </style>
</head>
<body>
    <div class="header">LAMPIRAN BUKTI FISIK | Dapur: <span id="lblDapur"></span> | PIC: <span id="lblPIC"></span></div>
    
    <h3>I. Progress Pekerjaan</h3><div id="gridKerja"></div>
    <div style="page-break-before: always;"></div>
    <h3>II. Nota Belanja</h3><div id="gridNota"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const data = JSON.parse(localStorage.getItem('smm_siap_cetak'));
        if(!data) return;

        document.getElementById('lblDapur').innerText = data.bundle.namaDapur;
        document.getElementById('lblPIC').innerText = data.bundle.pic;

        const imgHtml = (src, title) => `<div class="photo-card"><img src="${src}"><div>${title}</div></div>`;
        const item = data.items[0];
        
        const gKerja = document.getElementById('gridKerja');
        if(item.fotoKerja?.length) item.fotoKerja.forEach((s,i) => gKerja.innerHTML += imgHtml(s, `Foto Kerja #${i+1}`));
        else gKerja.innerHTML = "Tidak ada foto kerja.";

        const gNota = document.getElementById('gridNota');
        if(item.fotoNota?.length) item.fotoNota.forEach((s,i) => gNota.innerHTML += imgHtml(s, `Foto Nota #${i+1}`));
        else gNota.innerHTML = "Tidak ada nota.";

        setTimeout(() => window.print(), 800);
    });
</script>
</body>
</html>
